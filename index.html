<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinuxMaster — Interactive Linux Terminal Learning Platform</title>
  <meta name="description" content="Learn Linux terminal commands step-by-step in a real-time simulated environment. A to Z curriculum from beginner to advanced.">

  <!-- Performance & Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐧</text></svg>">
</head>
<body>

<!-- Ambient 3D Cyber Background -->
<div class="ambient-3d-bg" id="ambient-3d-bg" aria-hidden="true">
  <div class="cyber-grid-plane"></div>
  <div class="ambient-glow orb-1"></div>
  <div class="ambient-glow orb-2"></div>
</div>

<div id="app">

  <!-- ── Top Bar ──────────────────────────────────────────────── -->
  <header id="topbar">
    <div class="topbar-left">
      <!-- Mobile sidebar toggle -->
      <button id="sidebar-toggle" title="Toggle curriculum sidebar" aria-label="Toggle sidebar">☰</button>

      <div class="topbar-logo">
        <span class="logo-icon">🐧</span>
        <span class="logo-text">Linux<span class="logo-accent">Master</span></span>
      </div>

      <div class="author-badge" title="Created by Akhil Binu">
        <span class="author-prefix">Built by</span>
        <span class="author-name">Akhil Binu</span>
      </div>

      <div class="topbar-progress">
        <div class="progress-bar-track" title="Lesson progress">
          <div id="progress-bar-fill"></div>
        </div>
        <span id="progress-label" style="white-space:nowrap">0 / 26 Lessons</span>
      </div>
    </div>

    <!-- Mobile Screen View Switcher (visible on mobile / small screens) -->
    <div id="mobile-view-tabs" class="mobile-only" role="tablist" aria-label="Mobile View Mode">
      <button class="m-tab-btn" data-view="lesson" title="Lesson Only">📖 Lesson</button>
      <button class="m-tab-btn active" data-view="split" title="Split View">◫ Split</button>
      <button class="m-tab-btn" data-view="terminal" title="Terminal CLI Only">💻 CLI</button>
    </div>

    <div class="topbar-right">
      <!-- Theme Switcher -->
      <div class="theme-dropdown-wrapper" id="theme-dropdown-wrapper">
        <button class="btn-topbar btn-theme" id="btn-theme" title="Switch Theme (Cyberpunk, Dracula, Matrix, Tokyo)" aria-haspopup="true" aria-expanded="false">
          <span class="btn-icon">🎨</span><span class="btn-text" id="theme-label">Cyberpunk</span><span class="dropdown-arrow">▾</span>
        </button>
        <div class="theme-menu hidden" id="theme-menu" role="menu">
          <button class="theme-option active" data-theme="cyberpunk" role="menuitem">
            <span class="theme-swatch" style="background: linear-gradient(135deg, #00f0ff, #a855f7);"></span>
            <span>Cyberpunk Neon</span>
          </button>
          <button class="theme-option" data-theme="dracula" role="menuitem">
            <span class="theme-swatch" style="background: linear-gradient(135deg, #bd93f9, #50fa7b);"></span>
            <span>Dracula Classic</span>
          </button>
          <button class="theme-option" data-theme="matrix" role="menuitem">
            <span class="theme-swatch" style="background: linear-gradient(135deg, #00ff88, #00e5ff);"></span>
            <span>Midnight Matrix</span>
          </button>
          <button class="theme-option" data-theme="tokyo" role="menuitem">
            <span class="theme-swatch" style="background: linear-gradient(135deg, #7aa2f7, #bb9af7);"></span>
            <span>Tokyo Night</span>
          </button>
        </div>
      </div>

      <!-- 3D FX Toggle -->
      <button class="btn-topbar btn-3d-toggle active" id="btn-toggle-3d" title="Toggle 3D Visual Effects & Tilt">
        <span class="btn-icon">✨</span><span class="btn-text">3D FX</span>
      </button>

      <button class="btn-topbar" id="btn-open-cheatsheet" title="Linux Command Reference & Cheat Sheet">
        <span class="btn-icon">📚</span><span class="btn-text">Cheatsheet</span>
      </button>
      <button class="btn-topbar" onclick="window.resetProgress()" title="Reset all progress">
        <span class="btn-icon">↺</span><span class="btn-text">Reset</span>
      </button>
      <a class="btn-topbar desktop-only" href="https://linux.die.net/man/" target="_blank" rel="noopener" title="Linux man pages reference">
        <span class="btn-icon">📖</span><span class="btn-text">Docs</span>
      </a>
    </div>
  </header>

  <!-- ── Main Split ───────────────────────────────────────────── -->
  <div id="main-split">

    <!-- ── Sidebar: Curriculum ──────────────────────────────── -->
    <nav id="sidebar" role="navigation" aria-label="Linux curriculum">
      <div class="sidebar-header">
        <div class="sidebar-header-top">
          <div class="sidebar-title">A to Z Curriculum</div>
          <button id="sidebar-close-btn" class="sidebar-close-btn mobile-only" aria-label="Close sidebar">✕</button>
        </div>
        <input
          type="text"
          class="sidebar-search"
          placeholder="Search lessons..."
          id="sidebar-search"
          aria-label="Search lessons"
          oninput="filterLessons(this.value)"
        >
      </div>
      <ul id="lesson-list" role="listbox" aria-label="Lesson list"></ul>
    </nav>

    <!-- ── Panel Resizer ────────────────────────────────────── -->
    <div id="panel-resizer" role="separator" aria-label="Resize panels" tabindex="0"></div>

    <!-- ── Right Pane ───────────────────────────────────────── -->
    <div id="right-pane">

      <!-- Lesson Content -->
      <div id="lesson-pane" role="main" aria-label="Lesson content">
        <div id="lesson-panel">
          <!-- Rendered dynamically by app.js -->
          <div style="text-align:center;padding:60px 20px;color:var(--fg-dim)">
            <div style="font-size:4rem;margin-bottom:16px">🐧</div>
            <h2 style="color:var(--fg);margin-bottom:8px">Welcome to LinuxMaster</h2>
            <p>Select a lesson from the sidebar to start learning.</p>
          </div>
        </div>
      </div>

      <!-- Horizontal Resizer -->
      <div id="hpanel-resizer" role="separator" aria-label="Resize terminal"></div>

      <!-- Terminal Pane -->
      <div id="terminal-pane" role="region" aria-label="Interactive terminal">
        <!-- Terminal component rendered here by terminal.js -->
      </div>

    </div><!-- /#right-pane -->

  </div><!-- /#main-split -->

</div><!-- /#app -->

<!-- Cheatsheet Modal -->
<div id="cheatsheet-modal" class="modal-backdrop hidden" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-header">
      <div class="modal-title">🐧 Linux Command Reference & Cheat Sheet</div>
      <button class="modal-close" id="btn-close-cheatsheet" aria-label="Close modal">×</button>
    </div>
    <div class="modal-search-row">
      <input type="text" id="cheatsheet-search" placeholder="Search commands, flags or descriptions..." aria-label="Search cheatsheet">
    </div>
    <div class="modal-tabs" id="cheatsheet-tabs">
      <button class="tab-btn active" data-cat="all">All</button>
      <button class="tab-btn" data-cat="files">Files & Dirs</button>
      <button class="tab-btn" data-cat="text">Text Processing</button>
      <button class="tab-btn" data-cat="sys">System & Info</button>
      <button class="tab-btn" data-cat="net">Networking</button>
      <button class="tab-btn" data-cat="proc">Processes</button>
      <button class="tab-btn" data-cat="users">Users & Perms</button>
      <button class="tab-btn" data-cat="archive">Archiving</button>
      <button class="tab-btn" data-cat="shell">Shell & Math</button>
    </div>
    <div class="modal-body" id="cheatsheet-content">
      <!-- Generated dynamically by app.js -->
    </div>
  </div>
</div>

<!-- Mobile sidebar overlay -->
<div id="sidebar-overlay" class="hidden" aria-hidden="true"></div>

<!-- ── Scripts (order matters) ───────────────────────────────── -->
<script src="js/utils.js"></script>
<script src="js/vfs.js"></script>
<script src="js/terminal.js"></script>
<script src="js/commandParser.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/app.js"></script>

<!-- ── Inline Bootstrap Scripts ─────────────────────────────── -->
<script>
  // ── Lesson Search Filter (RAF Optimized) ─────────────────────
  let filterRaf = null;
  function filterLessons(query) {
    if (filterRaf) cancelAnimationFrame(filterRaf);
    filterRaf = requestAnimationFrame(() => {
      const q = query.toLowerCase();
      document.querySelectorAll('.lesson-item').forEach(li => {
        const label = li.querySelector('.lesson-label').textContent.toLowerCase();
        li.style.display = label.includes(q) ? '' : 'none';
      });
    });
  }

  // ── Touch & Mouse Horizontal Resizer (RAF Optimized) ─────────
  (function initHResizer() {
    const resizer = document.getElementById('hpanel-resizer');
    const termPane = document.getElementById('terminal-pane');
    if (!resizer || !termPane) return;

    let isResizing = false;
    let startY = 0, startH = 0;
    let hResizeRaf = null;

    const startDrag = (clientY) => {
      // Don't drag if in full lesson or full terminal view mode
      const rightPane = document.getElementById('right-pane');
      if (rightPane && (rightPane.classList.contains('view-lesson-only') || rightPane.classList.contains('view-terminal-only'))) return;
      isResizing = true;
      startY = clientY;
      startH = termPane.offsetHeight;
      document.body.style.cursor = 'row-resize';
      document.body.style.userSelect = 'none';
    };

    const dragMove = (clientY) => {
      if (!isResizing) return;
      if (hResizeRaf) return;
      hResizeRaf = requestAnimationFrame(() => {
        hResizeRaf = null;
        if (!isResizing) return;
        const dy = startY - clientY;
        const minH = 120;
        const maxH = Math.max(minH, window.innerHeight - 140);
        const newH = Math.max(minH, Math.min(maxH, startH + dy));
        termPane.style.height = newH + 'px';
      });
    };

    const endDrag = () => {
      if (isResizing) {
        isResizing = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    };

    resizer.addEventListener('mousedown', (e) => startDrag(e.clientY));
    document.addEventListener('mousemove', (e) => dragMove(e.clientY));
    document.addEventListener('mouseup', endDrag);

    // Touch support for tablets & phones
    resizer.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches[0]) startDrag(e.touches[0].clientY);
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches[0]) dragMove(e.touches[0].clientY);
    }, { passive: true });
    document.addEventListener('touchend', endDrag);
  })();

  // ── Mobile Screen View Switcher ──────────────────────────────
  (function initMobileViewSwitcher() {
    const tabs = document.querySelectorAll('#mobile-view-tabs .m-tab-btn');
    const rightPane = document.getElementById('right-pane');
    if (!tabs.length || !rightPane) return;

    window.setMobileView = function(view) {
      tabs.forEach(btn => btn.classList.toggle('active', btn.dataset.view === view));
      rightPane.classList.remove('view-lesson-only', 'view-terminal-only');

      if (view === 'lesson') {
        rightPane.classList.add('view-lesson-only');
      } else if (view === 'terminal') {
        rightPane.classList.add('view-terminal-only');
        setTimeout(() => document.getElementById('term-hidden-input')?.focus(), 50);
      }
    };

    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        window.setMobileView(btn.dataset.view);
      });
    });
  })();

  // ── Sidebar Close Button on Mobile ───────────────────────────
  document.getElementById('sidebar-close-btn')?.addEventListener('click', () => {
    document.getElementById('sidebar')?.classList.remove('sidebar-open');
    document.getElementById('sidebar-overlay')?.classList.add('hidden');
  });

  // ── Keyboard Shortcuts (global) ──────────────────────────────
  document.addEventListener('keydown', (e) => {
    // Ctrl+/ — focus terminal
    if (e.ctrlKey && e.key === '/') {
      e.preventDefault();
      document.getElementById('term-hidden-input')?.focus();
    }
    // Escape — close mobile sidebar
    if (e.key === 'Escape') {
      document.getElementById('sidebar')?.classList.remove('sidebar-open');
      document.getElementById('sidebar-overlay')?.classList.add('hidden');
    }
  });
</script>

</body>
</html>
